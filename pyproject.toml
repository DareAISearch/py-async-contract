[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-async-contract"
version = "0.1.0"
description = "Shared async job contract for DAIS services: idempotent submits (Idempotency-Key, Job-Id, Location) and webhook delivery (headers, event ids, body hashing, retry rules), for both the calling and the called service."
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
authors = [{ name = "Nishant Kumar", email = "nishant.kumar@dareaisearch.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
]

[project.urls]
Homepage = "https://github.com/DareAISearch/py-async-contract"
Repository = "https://github.com/DareAISearch/py-async-contract"
Issues = "https://github.com/DareAISearch/py-async-contract/issues"

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.54.0",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "mypy>=2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py_async_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `= Depends(...)` default-argument pattern is the documented idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["py_async_contract"]
mypy_path = "src"
